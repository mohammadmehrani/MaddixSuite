name: Test Linux (Bash)
on:
  push:
    branches: [main]
    paths: ['linux/**', 'tests/linux/**']
  pull_request:
    branches: [main]
    paths: ['linux/**', 'tests/linux/**']

jobs:
  test:
    name: BATS + ShellCheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run BATS Tests
        run: bats tests/linux/
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./linux
          severity: style
          ignore_paths: >-
            linux/ToolLib
